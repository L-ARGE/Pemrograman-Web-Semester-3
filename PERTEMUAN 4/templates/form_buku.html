<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ 'Edit' if buku else 'Tambah' }} Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 700px;">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5">
                <h3 class="mb-4">{{ 'Edit Data Buku' if buku else 'Tambah Buku Baru' }}</h3>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} shadow-sm">{{ message }}</div>
                    {% endfor %}
                {% endwith %}

                <form method="POST" class="d-flex flex-column gap-3">
                    <div>
                        <label class="form-label fw-medium">Judul Buku</label>
                        <input type="text" name="judul" class="form-control" value="{{ buku.judul if buku else '' }}" required>
                    </div>

                    <div>
                        <label class="form-label fw-medium">Penulis</label>
                        <input type="text" name="penulis" class="form-control" value="{{ buku.penulis if buku else '' }}" required>
                    </div>

                    <div>
                        <label class="form-label fw-medium">Penerbit</label>
                        <input type="text" name="penerbit" class="form-control" value="{{ buku.penerbit if buku else '' }}" required>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Tahun Terbit</label>
                            <input type="number" name="tahun_terbit" class="form-control" min="1901" max="2155" value="{{ buku.tahun_terbit if buku else tahun_sekarang }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium">Stok Buku</label>
                            <input type="number" name="stok" class="form-control" min="0" value="{{ buku.stok if buku else 0 }}" required>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary px-4">Simpan</button>
                        <a href="{{ url_for('daftar_buku') }}" class="btn btn-secondary px-4">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
