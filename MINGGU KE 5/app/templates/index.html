
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REST Client - Data Barang</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2>Sistem Data Barang</h2>
    <p class="text-secondary">
        Flask REST API + MySQL XAMPP + jQuery
    </p>

    <div id="pesan" class="alert d-none"></div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header" id="judulForm">Tambah Barang</div>

        <div class="card-body">
            <form id="formBarang">
                <input type="hidden" id="barangId">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nama Barang</label>
                        <input id="nama" class="form-control"
                               maxlength="100" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Harga</label>
                        <input id="harga" type="number"
                               min="0" step="0.01"
                               class="form-control" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Stok</label>
                        <input id="stok" type="number"
                               min="0" step="1"
                               class="form-control" required>
                    </div>

                    <div class="col-md-3 d-flex align-items-end gap-2">
                        <button id="btnSimpan" class="btn btn-primary">
                            Simpan
                        </button>

                        <button type="button" id="btnBatal"
                                class="btn btn-secondary d-none">
                            Batal
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between">
            <strong>Daftar Barang</strong>
            <button id="btnMuat" class="btn btn-outline-primary btn-sm">
                Muat Ulang
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="tabelBarang">
                    <tr>
                        <td colspan="5" class="text-center">
                            Memuat data...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$(function () {
    const apiUrl = "/api/barang";

    function tampilPesan(teks, jenis = "success") {
        $("#pesan")
            .removeClass("d-none alert-success alert-danger")
            .addClass("alert-" + jenis)
            .text(teks);
    }

    function resetForm() {
        $("#formBarang")[0].reset();
        $("#barangId").val("");
        $("#judulForm").text("Tambah Barang");
        $("#btnSimpan").text("Simpan");
        $("#btnBatal").addClass("d-none");
    }

    // GET: menampilkan data
    function muatBarang() {
        $.ajax({
            url: apiUrl,
            method: "GET",
            dataType: "json"
        }).done(function (data) {
            const tabel = $("#tabelBarang").empty();

            if (data.length === 0) {
                tabel.append(
                    $("<tr>").append(
                        $("<td>", {
                            colspan: 5,
                            class: "text-center",
                            text: "Belum ada data barang"
                        })
                    )
                );
                return;
            }

            data.forEach(function (barang) {
                const baris = $("<tr>");

                baris.append($("<td>").text(barang.id));
                baris.append($("<td>").text(barang.nama));
                baris.append(
                    $("<td>").text(
                        "Rp " + Number(barang.harga).toLocaleString("id-ID")
                    )
                );
                baris.append($("<td>").text(barang.stok));

                // Tombol edit
                const edit = $("<button>", {
                    type: "button",
                    class: "btn btn-warning btn-sm me-1",
                    text: "Edit"
                }).on("click", function () {
                    $("#barangId").val(barang.id);
                    $("#nama").val(barang.nama);
                    $("#harga").val(barang.harga);
                    $("#stok").val(barang.stok);
                    $("#judulForm").text("Edit Barang");
                    $("#btnSimpan").text("Update");
                    $("#btnBatal").removeClass("d-none");
                });

                // Tombol hapus
                const hapus = $("<button>", {
                    type: "button",
                    class: "btn btn-danger btn-sm",
                    text: "Hapus"
                }).on("click", function () {
                    if (!confirm("Yakin ingin menghapus barang ini?")) {
                        return;
                    }

                    $.ajax({
                        url: apiUrl + "/" + barang.id,
                        method: "DELETE"
                    }).done(function () {
                        tampilPesan("Barang berhasil dihapus");
                        muatBarang();
                    }).fail(function (xhr) {
                        tampilPesan(
                            xhr.responseJSON?.error || "Gagal menghapus",
                            "danger"
                        );
                    });
                });

                baris.append(
                    $("<td>").append(edit, hapus)
                );

                tabel.append(baris);
            });
        }).fail(function (xhr) {
            tampilPesan(
                xhr.responseJSON?.error || "Gagal mengambil data API",
                "danger"
            );
        });
    }

    // POST: tambah, PUT: ubah
    $("#formBarang").on("submit", function (event) {
        event.preventDefault();

        const id = $("#barangId").val();

        const dataBarang = {
            nama: $("#nama").val().trim(),
            harga: $("#harga").val(),
            stok: $("#stok").val()
        };

        $.ajax({
            url: id ? apiUrl + "/" + id : apiUrl,
            method: id ? "PUT" : "POST",
            contentType: "application/json",
            data: JSON.stringify(dataBarang)
        }).done(function () {
            tampilPesan(
                id ? "Barang berhasil diperbarui"
                   : "Barang berhasil ditambahkan"
            );

            resetForm();
            muatBarang();
        }).fail(function (xhr) {
            tampilPesan(
                xhr.responseJSON?.error || "Gagal menyimpan data",
                "danger"
            );
        });
    });

    $("#btnBatal").on("click", resetForm);
    $("#btnMuat").on("click", muatBarang);

    // GET otomatis ketika halaman dibuka
    muatBarang();
});
</script>

</body>
</html>
