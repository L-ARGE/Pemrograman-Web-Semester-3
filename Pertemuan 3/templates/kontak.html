{% extends 'layout.html' %}

{% block title %}Hubungi Kami{% endblock %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-8">
        
        <h2 class="mb-4">Kontak Saya</h2>

        <form action="#" method="POST">
            
            <div class="mb-3">
                <label for="namaLengkap" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="namaLengkap" placeholder="Masukkan nama kamu">
            </div>

            <div class="mb-3">
                <label for="alamatEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="alamatEmail" placeholder="nama@email.com">
            </div>

            <div class="mb-4">
                <label for="pesanTeks" class="form-label">Pesan</label>
                <textarea class="form-control" id="pesanTeks" rows="4" placeholder="Tulis pesanmu di sini..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Kirim Pesan</button>
            
        </form>

    </div>
</div>
{% endblock %}
